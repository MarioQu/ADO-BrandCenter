<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <title>Document</title>
        
        <style>
            .nav-pills .nav-link{
                background-color: #fff !important;
                border-radius: 0;
                color: #9B9B9B;
                border: none;
                width: 100%;
                border-bottom: 3px solid #9B9B9B;
            }
            .nav-pills .nav-link.active, .nav-pills .show>.nav-link {
                color: #5F2167;
                font-weight: 600;
                border-bottom: 3px solid #5F2167;
            }
            form button[type="submit"]{
                background-color: #5F2167;
                color: #fff;
                border-radius: 0;
                box-shadow: none !important;
                padding: 5px 20px;
            }
            form .form-control{
                background-color: #F6F7FB;
                border: 1px solid #FAFBFD;
            }
            form label{
                margin-bottom: 5px !important;
            }
            textarea{
                resize: none !important;
            }
            
            .card{
                background-color: #5F2167;
                border-radius: 16px;
                padding: 30px;
            }
            .logomobado{
                width: 200px;
            }
        </style>
    </head>
    
    <body>
        <section class="container">
            <div class="row">
                <div class="col-6">
                    <ul class="nav nav-pills mb-3 nav-fill" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tabForm-tab" data-toggle="pill" data-target="#tabForm" type="button" role="tab" aria-controls="tabForm" aria-selected="true">
                                ¿No encuentras un material?
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tabComments-tab" data-toggle="pill" data-target="#tabComments" type="button" role="tab" aria-controls="tabComments" aria-selected="false">
                                Comentarios
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="tabForm" role="tabpanel" aria-labelledby="tabForm-tab">
                            <p class="fc-black fs-16 text-center">
                                Llena el siguiente formulario para hacer la solicitud del material que necesitas. 
                                En breve nos pondremos en contacto contigo.
                            </p>
                            
                            <form id="form-material" class="mt-4">
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="nombre" class="form-label">Nombre:</label>
                                        <input type="text" class="form-control" id="nombre" aria-describedby="nombre">
                                    </div>
                                    <div class="col mb-3">
                                        <label for="apellidos" class="form-label">Apellidos:</label>
                                        <input type="text" class="form-control" id="apellidos" aria-describedby="apellidos">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="correo" class="form-label">Correo:</label>
                                        <input type="email" class="form-control" id="correo" aria-describedby="correo">
                                    </div>
                                    <div class="col mb-3">
                                        <label for="area" class="form-label">Área:</label>
                                        <input type="text" class="form-control" id="area" aria-describedby="area">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="correo" class="form-label"><br> Tipo de material a solicitar:</label>
                                        <select class="form-control" aria-label="Default select example">
                                            <option selected>Open this select menu</option>
                                            <option value="1">Imágenes</option>
                                            <option value="2">PDF</option>
                                            <option value="3">Otro</option>
                                        </select>
                                    </div>
                                    <div class="col mb-3">
                                        <label for="correo" class="form-label">¿A qué área pertenece el material?:</label>
                                        <select class="form-control" aria-label="Default select example">
                                            <option selected>Open this select menu</option>
                                            <option value="1">Diseño</option>
                                            <option value="2">Ventas</option>
                                            <option value="3">RH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="correo" class="form-label">Comentarios:</label>
                                        <textarea class="form-control" id="comentarios" rows="5"></textarea>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3 text-center">
                                        <button type="submit" class="btn" id="solicitar-m">Solicitar</button>
                                    </div>
                                </div>                                                                                                
                            </form>
                        </div><!-- tab Formulario Assets -->
                        
                        <div class="tab-pane fade" id="tabComments" role="tabpanel" aria-labelledby="tabComments-tab">
                            <form id="form-comentarios" class="mt-5">
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="nombre" class="form-label">Nombre:</label>
                                        <input type="text" class="form-control" id="nombre2" aria-describedby="nombre">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="correo2" class="form-label">Correo:</label>
                                        <input type="email" class="form-control" id="correo2" aria-describedby="correo">
                                    </div>
                                    <div class="col mb-3">
                                        <label for="area2" class="form-label">Área:</label>
                                        <input type="text" class="form-control" id="area2" aria-describedby="area">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3">
                                        <label for="comentarios2" class="form-label">Comentarios:</label>
                                        <textarea class="form-control" id="comentarios2" rows="5"></textarea>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col mb-3 text-center">
                                        <button type="submit" class="btn" id="solicitar-c">Solicitar</button>
                                    </div>
                                </div>                                                                                                
                            </form>
                        </div><!-- tab Formulario Comentarios -->
                    </div>   
                </div>
                
                <div class="col-6">
                    <div class="card text-center">
                        <p class="fc-white fs-20" style="font-weight: 400;">¿No encuentras el recurso que necesitas?</p>
                        <p class="fc-white fw-700 fs-40">¡Contáctanos!</p>
                        
                        <p class="fc-white fs-30" style="line-height: 40px; margin-top: 100px; margin-bottom: 100px;">
                            ¡Gracias! <br>
                            Esto nos ayuda a mejorar
                        </p>
                        
                        <img src="/documents/d/mobilityado/logo_madoblanco_1" alt="" class="img-fluid logomobado">
                    </div>
                </div>
            </div>
        </section>

        
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    </body>
</html>
